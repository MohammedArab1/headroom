name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      fail-fast: false
      # macOS runs /bin/bash 3.2: any accidental bash-4-only feature fails there.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyYAML for the catalog validator
        run: python3 -m pip install --quiet pyyaml
      - name: syntax + shellcheck
        run: |
          for f in scripts/*.sh launcher/*.sh; do /bin/bash -n "$f" || exit 1; done
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install shellcheck
            else
              sudo apt-get update && sudo apt-get install -y shellcheck
            fi
          fi
          shellcheck scripts/*.sh launcher/*.sh
      - name: offline tests (fake adb, no head unit)
        run: python3 -m unittest discover -s tests -v
      - name: catalog
        run: python3 catalog/validate.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests, lint, release build
        working-directory: launcher
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: budgets (size, zero permissions, no background components)
        run: launcher/check-budgets.sh
